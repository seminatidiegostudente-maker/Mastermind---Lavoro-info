<!DOCTYPE html>
<html lang="it">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastermind - Code Breaker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game">

        <header class="header">
            <h1>MASTER<span>MIND</span></h1>
        </header>

        <section class="stats">
            <div class="stat">
                <span>TENTATIVO</span>
                <strong>01 / 10</strong>
            </div>

            <div class="stat">
                <span>TEMPO</span>
                <strong>00:00</strong>
            </div>

            <div class="stat">
                <span>RECORD</span>

            </div>
        </section>

                </div>

                    <div class="secret-slot"></div>
                    <div class="secret-slot"></div>
                </div>
            </div>

            <div class="attempts">

                <div class="attempt active">
                    <span class="number">01</span>
